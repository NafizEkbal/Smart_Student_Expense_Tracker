{% extends "base.html" %}

{% block title%} Add Transaction - Smart Student Expense Tracker {% endblock %}

{% block content %}
    <main class="dashboard-main">
      <header class="dashboard-header">
        <h1>Add New Transaction 💸</h1>
        <p>Add your daily income or expense in one place.</p>
      </header>

      <section class="transactions-section">
        <form method="post" action="/add_transaction">
          <div class="form-group">
            <label>Title</label>
            <input type="text" placeholder="e.g. Lunch, Bus Fare, Pocket Money" name="title" required />
          </div>

          <div class="form-group">
            <label>Amount</label>
            <input type="number" placeholder="Enter amount" name="amount" required />
          </div>

          <div class="form-group">
            <label>Category</label>
            <input type="text" placeholder="Food, Transport, Study" name="category" required />
          </div>

          <div class="form-group">
            <label>Transaction Type</label>
            <select name="transactionType">
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label>Notes</label>
            <input type="text" placeholder="Optional note" name="note" />
          </div>

          <button class="login-btn" type="submit">Save Transaction</button>
        </form>
      </section>
    </main>
{% endblock %}
