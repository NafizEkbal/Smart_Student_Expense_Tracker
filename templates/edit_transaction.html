{% extends "base.html" %}

{% block title%} Edit Transaction - Smart Student Expense Tracker {% endblock %}

{% block content %}
    <main class="dashboard-main">
      <header class="dashboard-header">
        <h1>Edit Transaction 💸</h1>
        <p>Update or Delete your income and expense in one place.</p>
      </header>

      <section class="transactions-section">
        <form method="post" action="/edit_transaction/{{transaction[0]}}">
          <div class="form-group">
            <label>Title </label>
            <input type="text" placeholder="e.g. Lunch, Bus Fare, Pocket Money" name="title" required value = "{{transaction[2]}}" />
          </div>

          <div class="form-group">
            <label>Amount</label>
            <input type="number" placeholder="Enter amount" name="amount" value="{{transaction[3]}}" required />
          </div>

          <div class="form-group">
            <label>Category</label>
            <input type="text" placeholder="Food, Transport, Study" name="category" value="{{transaction[4]}}" required />
          </div>

          <div class="form-group">
            <label>Transaction Type</label>
            <select name="transactionType">
            <option value="income" {% if transaction[5]=='income' %}selected{% endif %}>Income</option>
            <option value="expense" {% if transaction[5]=='expense' %}selected{% endif %}>Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label>Notes</label>
            <input type="text" placeholder="Optional note" value="{{transaction[6]}}" name="note" />
          </div>

          <div class="btn-group">
             <button class="update-btn" type="submit" name="action" value="update">
                 Update Transaction
             </button>

             <button class="delete-btn" type="submit" name="action" value="delete" onclick="return confirm('Are you sure you want to delete this transaction?')">
                Delete Transaction
            </button>
          </div>
        </form>
      </section>
    </main>
{% endblock %}
